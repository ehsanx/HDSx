bibliography: references.bib

format:
  html:
    toc: true
    number-sections: false
    number-depth: 0
    theme: cosmo
    df-print: paged
    code-fold: false
    code-overflow: wrap
    code-copy: hover
    code-line-numbers: true
    code-link: true
    code-summary: "Show the code"
    code-tools: 
      source: false
      toggle: true
      caption: none
  pdf:
    toc: true
    toc-depth: 2
    number-sections: false
    number-depth: 0
    toc-title: "Table of contents"
    code-line-numbers: true
    pdf-engine: xelatex
    header-includes:
      - \usepackage[table]{xcolor}
      - \usepackage{tcolorbox}
      - \tcbuselibrary{skins,breakable}
      - \definecolor{brandblue}{HTML}{002145}
      - \definecolor{brandlight}{HTML}{0055B7}
    colorlinks: true
    keep-tex: true
    papersize: letter
    
prefer-html: true

knitr:
  opts_chunk: 
    collapse: true
    comment: "#>" 
    R.options:
      knitr.graphics.auto_pdf: true

editor: visual
