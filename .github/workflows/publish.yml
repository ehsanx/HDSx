on:
  push:
    branches: [main]
  workflow_dispatch:

name: Publish to GitHub Pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release
          tinytex: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: "4.6.1"

      - name: Install R packages
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render site
        run: quarto render

      - name: Disable Jekyll processing of the rendered site
        run: touch docs/.nojekyll

      # GitHub Pages serves this repo from the gh-pages branch, /docs folder.
      # `quarto publish gh-pages` can only write to the branch root, so the
      # rendered docs/ is pushed into docs/ on gh-pages instead.
      - name: Deploy to gh-pages/docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          target-folder: docs
